processing:
  remove_duplicates: true
  missing:
    enabled: true
    axis: "rows"
  outliers:
    enabled: true
    columns:
      - Score
    method: "iqr"
    threshold: 1.5
  validation:
    enabled: true
    required_columns:
      - record_id
      - name
      - rating
      - category
      - status
    numeric_columns:
      - rating